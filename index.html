<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Valentine Proposal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffe4e6;
            overflow-x: hidden;
            touch-action: pan-y;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Loader Styles */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #ffe4e6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 1s ease-out, visibility 1s;
        }

        .loader-heart {
            width: 80px;
            height: 80px;
            background-color: #f43f5e;
            position: relative;
            transform: rotate(-45deg);
            animation: pulse-heart 1.2s infinite;
        }

        .loader-heart::before,
        .loader-heart::after {
            content: "";
            width: 80px;
            height: 80px;
            background-color: #f43f5e;
            border-radius: 50%;
            position: absolute;
        }

        .loader-heart::before { top: -40px; left: 0; }
        .loader-heart::after { left: 40px; top: 0; }

        @keyframes pulse-heart {
            0% { transform: rotate(-45deg) scale(0.8); }
            50% { transform: rotate(-45deg) scale(1.2); }
            100% { transform: rotate(-45deg) scale(0.8); }
        }

        .bg-heart {
            position: absolute;
            color: rgba(244, 63, 94, 0.2);
            font-size: 1.5rem;
            animation: floatUp 8s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        #no-btn {
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
            min-width: 140px;
        }

        #yes-btn {
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            animation: fall linear forwards;
            pointer-events: none;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }

        .pulse-border {
            animation: pulse-shadow 2s infinite;
        }
        @keyframes pulse-shadow {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.4); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 15px rgba(244, 63, 94, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
        }

        .animate-pop {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="w-screen flex flex-col items-center justify-center relative select-none p-4">

    <!-- PRELOADER -->
    <div id="loader">
        <div class="loader-heart"></div>
        <div class="mt-20 text-center">
            <p id="loader-text" class="text-rose-500 font-bold animate-pulse text-lg">Preparing a surprise...</p>
            <p class="text-rose-400 text-xs mt-2 italic">Gathering all the love...</p>
        </div>
    </div>

    <div id="heart-bg" class="absolute inset-0 overflow-hidden pointer-events-none"></div>

    <!-- THE PROPOSAL CARD -->
    <div id="proposal-card" class="bg-white/95 backdrop-blur-sm p-6 md:p-8 rounded-3xl shadow-2xl text-center w-[95%] max-w-sm z-10 border-2 border-rose-200 pulse-border animate-pop">
        <div class="mb-4">
            <div class="text-7xl md:text-8xl animate-bounce">🎮🌹</div>
        </div>

        <h1 id="proposal-title" class="text-3xl md:text-4xl font-extrabold text-rose-600 mb-4 leading-tight">
            Hey, Priyasha!
        </h1>
        
        <div class="space-y-2 mb-8 text-rose-500 font-medium text-lg italic">
            <p>Roses are red, Sky is blue!</p>
            <p class="font-bold text-rose-600">Will you be my player No. 2?</p>
        </div>

        <div class="flex flex-col items-center justify-center gap-4 w-full">
            <button id="yes-btn" onclick="acceptProposal()" 
                class="w-full bg-gradient-to-r from-rose-500 to-pink-600 text-white font-bold py-5 px-8 rounded-2xl text-2xl shadow-lg transform transition active:scale-90 focus:outline-none ring-4 ring-rose-100 z-20">
                YES! 😍
            </button>

            <button id="no-btn" 
                onmouseover="moveButton()" 
                onclick="moveButton(event)" 
                ontouchstart="moveButton(event)"
                class="bg-gray-100 text-gray-400 font-medium py-3 px-8 rounded-xl shadow-sm focus:outline-none z-20 flex flex-col items-center justify-center">
                <span class="text-lg font-bold">No 🙄</span>
                <span id="no-subtext" class="text-xs opacity-0 transition-opacity">Are you sure?</span>
            </button>
        </div>
    </div>

    <!-- SUCCESS SCREEN (Teddy Theme) -->
    <div id="success-screen" class="hidden fixed inset-0 z-50 flex flex-col items-center justify-center bg-rose-50 p-6 text-center">
        <div class="animate-pop">
            <h1 class="text-5xl md:text-7xl font-black text-rose-600 mb-4">
                Hooray! 🧸
            </h1>
            <p class="text-xl md:text-2xl text-rose-800 font-medium mb-10">
                Sending you the biggest teddy hug! 😘
            </p>
            <div class="text-8xl md:text-9xl animate-pulse mb-10">🧸💖🧸</div>
            <p class="text-rose-500 italic">I promise to be your favorite teddy forever!</p>
        </div>
    </div>

    <script>
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loader-text');
        const proposalCard = document.getElementById('proposal-card');
        const successScreen = document.getElementById('success-screen');
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const noSubtext = document.getElementById('no-subtext');
        const heartBg = document.getElementById('heart-bg');

        let isAbsolute = false;
        let yesScale = 1;

        window.addEventListener('load', () => {
            setTimeout(() => {
                loaderText.innerText = "Almost there, Priyasha...";
            }, 2000);

            setTimeout(() => {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }, 4000); 
        });

        function moveButton(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            
            yesScale += 0.2;
            yesBtn.style.transform = `scale(${yesScale})`;

            const width = window.innerWidth;
            const height = window.innerHeight;
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            
            if (!isAbsolute) {
                isAbsolute = true;
                noBtn.style.position = 'fixed';
                noBtn.style.zIndex = '100';
                document.body.appendChild(noBtn);
            }

            const padding = 60;
            const maxLeft = width - btnWidth - padding;
            const maxTop = height - btnHeight - padding;

            let newLeft = Math.max(padding, Math.random() * maxLeft);
            let newTop = Math.max(padding, Math.random() * maxTop);

            noBtn.style.left = `${newLeft}px`;
            noBtn.style.top = `${newTop}px`;

            const funTexts = [
                "Wrong button!", 
                "Try again! 😜", 
                "You're missing out!", 
                "Still no? 🥺", 
                "I'm too cute for no!", 
                "Nice try! 😂", 
                "Yes is better!", 
                "Think again! ❤️"
            ];
            noSubtext.innerText = funTexts[Math.floor(Math.random() * funTexts.length)];
            noSubtext.style.opacity = '1';
            
            noBtn.style.backgroundColor = '#ffe4e6';
            noBtn.style.color = '#e11d48';
        }

        function acceptProposal() {
            proposalCard.classList.add('hidden');
            if(isAbsolute) noBtn.style.display = 'none';
            successScreen.classList.remove('hidden');
            successScreen.classList.add('flex');
            triggerConfetti();
        }

        function createHearts() {
            const heart = document.createElement('div');
            heart.classList.add('bg-heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 5) + 's';
            heartBg.appendChild(heart);
            setTimeout(() => heart.remove(), 8000);
        }
        setInterval(createHearts, 700);

        function triggerConfetti() {
            const colors = ['#f43f5e', '#ec4899', '#fb7185', '#fda4af'];
            for (let i = 0; i < 80; i++) {
                setTimeout(() => {
                    const c = document.createElement('div');
                    c.classList.add('confetti');
                    c.style.left = Math.random() * 100 + 'vw';
                    c.style.top = '-20px';
                    c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    c.style.animationDuration = (Math.random() * 2 + 1) + 's';
                    document.body.appendChild(c);
                    setTimeout(() => c.remove(), 3000);
                }, i * 15);
            }
        }
    </script>
</body>
</html>
